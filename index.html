<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>أميرة نور 💖</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(#ffb6c1, #ffc0cb);
    font-family: Arial, sans-serif;
    overflow: hidden;
    min-height: 100vh;
    text-align: center;
    position: relative;
}

.character-img {
    width: 150px;
    margin-top: 30px;
    transition: 0.5s;
}

.bubble {
    display: inline-block;
    background: white;
    border-radius: 25px;
    padding: 20px 25px;
    font-size: 20px;
    margin-top: 20px;
    position: relative;
    max-width: 80%;
}

.bubble:after {
    content: "";
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 15px;
    border-style: solid;
    border-color: white transparent transparent transparent;
}

.buttons {
    position: fixed;
    bottom: 30px;
    width: 100%;
    text-align: center;
}

button {
    padding: 15px 35px;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    margin: 0 15px;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
}

.yes {
    background: green;
    color: white;
}

.no {
    background: red;
    color: white;
    position: absolute;
}

.big-heart {
    font-size: 100px;
    animation: pop 0.6s infinite alternate;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.flying-heart {
    position: absolute;
    color: #ff1493;
    font-size: 25px;
    animation: float 4s linear infinite;
}

@keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.2); }
}

@keyframes float {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>
<body>

<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<img src="https://raw.githubusercontent.com/lami2006/love-you-site/main/kitty.png" class="character-img" id="character">

<div class="bubble" id="text">
مرحبا يا أميرة نور 💕<br>
منذ أن عرفتكِ أصبح عالمي أجمل ✨<br>
هل تقبلين أن تكوني حبيبتي في عيد الحب؟ 🌹
</div>

<div class="buttons">
    <button class="yes" onclick="yesClick()">نعم 💚</button>
    <button class="no" id="noBtn">لا ❌</button>
</div>

<script>
let noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function(){
    let x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    let y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function yesClick() {
    document.getElementById("character").src = "https://raw.githubusercontent.com/lami2006/love-you-site/main/kitty-happy.png";
    document.getElementById("text").innerHTML =
        "يااااي 💖<br>أسعدتِ قلبي يا أجمل أميرة في حياتي 🌸<br>أعدكِ أن أجعل كل أيامكِ حب وسعادة 💕";

    let heart = document.createElement("div");
    heart.className = "big-heart";
    heart.innerHTML = "💖";
    document.body.appendChild(heart);
}

function createHeart() {
    let heart = document.createElement("div");
    heart.className = "flying-heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";
    document.body.appendChild(heart);

    setTimeout(() => { heart.remove(); }, 4000);
}
setInterval(createHeart, 500);
</script>

</body>
</html>
ماذا يفهل هذا كود ؟
